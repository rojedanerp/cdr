<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagomarcambios - Iniciar Sesión</title>
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1d4e89">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lagomarcambios">
    <link rel="apple-touch-icon" href="img/icon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <svg width="100" height="62" viewBox="0 0 260 160" role="img" aria-label="Logo Lagomarcambios">
                    <rect x="16" y="38" width="17" height="90" rx="8.5" fill="#1d4e89"/>
                    <rect x="16" y="111" width="44" height="17" rx="8.5" fill="#1d4e89"/>
                    <path d="M83 128 L104 58 L120 82 L138 42 L163 128" fill="none" stroke="#1d4e89" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M225 47 A42 42 0 1 0 225 121" fill="none" stroke="#b8860b" stroke-width="15" stroke-linecap="round"/>
                    <path d="M14 146 Q 44 131 74 146 T 134 146 T 194 146 T 250 146" fill="none" stroke="#0e7c7b" stroke-width="9" stroke-linecap="round"/>
                </svg>
                <h1>Lagomarcambios</h1>
                <p>Sistema de Gestión Interna</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required placeholder="usuario@empresa.com">
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                    <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Mostrar contraseña">
                        <i class="ti ti-eye" id="togglePasswordIcon" aria-hidden="true"></i>
                    </button>
                </div>
                
                <div id="loginError" class="error-message"></div>
                
                <button type="submit" class="btn-primary" id="loginBtn">
                    <span class="btn-text">Iniciar Sesión</span>
                    <span class="spinner hidden"></span>
                </button>
            </form>
            
            <div class="login-footer">
                <p>Acceso exclusivo para personal autorizado</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth } from './js/firebase-config.js';
        
        // Verificar sesión existente
        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'app.html';
        });
        
        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');
            
            btn.disabled = true;
            btn.querySelector('.btn-text').textContent = 'Verificando...';
            
            try {
                await auth.signInWithEmailAndPassword(
                    document.getElementById('email').value,
                    document.getElementById('password').value
                );
                window.location.href = 'app.html';
            } catch (error) {
                const errores = {
                    'auth/user-not-found': 'Usuario no registrado',
                    'auth/wrong-password': 'Contraseña incorrecta',
                    'auth/invalid-email': 'Correo inválido',
                    'auth/too-many-requests': 'Demasiados intentos. Intenta más tarde.'
                };
                errorDiv.textContent = errores[error.code] || 'Error al iniciar sesión';
                btn.disabled = false;
                btn.querySelector('.btn-text').textContent = 'Iniciar Sesión';
            }
        });
        
        window.togglePassword = () => {
            const input = document.getElementById('password');
            const icon = document.getElementById('togglePasswordIcon');
            const oculto = input.type === 'password';
            input.type = oculto ? 'text' : 'password';
            icon.className = oculto ? 'ti ti-eye-off' : 'ti ti-eye';
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => {
                    console.log('No se pudo registrar el service worker:', err);
                });
            });
        }
    </script>
</body>
</html>
