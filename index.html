<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagomarcambios - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2">
                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
                </svg>
                <h1>Lagomarcambios</h1>
                <p>Sistema de Gestión Interna</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required placeholder="usuario@empresa.com">
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                    <button type="button" class="toggle-password" onclick="togglePassword()">👁</button>
                </div>
                
                <div id="loginError" class="error-message"></div>
                
                <button type="submit" class="btn-primary" id="loginBtn">
                    <span class="btn-text">Iniciar Sesión</span>
                    <span class="spinner hidden"></span>
                </button>
            </form>
            
            <div class="login-footer">
                <p>Acceso exclusivo para personal autorizado</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth } from './js/firebase-config.js';
        
        // Verificar sesión existente
        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'app.html';
        });
        
        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');
            
            btn.disabled = true;
            btn.querySelector('.btn-text').textContent = 'Verificando...';
            
            try {
                await auth.signInWithEmailAndPassword(
                    document.getElementById('email').value,
                    document.getElementById('password').value
                );
                window.location.href = 'app.html';
            } catch (error) {
                const errores = {
                    'auth/user-not-found': 'Usuario no registrado',
                    'auth/wrong-password': 'Contraseña incorrecta',
                    'auth/invalid-email': 'Correo inválido',
                    'auth/too-many-requests': 'Demasiados intentos. Intenta más tarde.'
                };
                errorDiv.textContent = errores[error.code] || 'Error al iniciar sesión';
                btn.disabled = false;
                btn.querySelector('.btn-text').textContent = 'Iniciar Sesión';
            }
        });
        
        window.togglePassword = () => {
            const input = document.getElementById('password');
            input.type = input.type === 'password' ? 'text' : 'password';
        };
    </script>
</body>
</html>
