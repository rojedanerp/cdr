<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagomarcambios - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" role="img" aria-label="Logo Lagomarcambios">
                    <circle cx="12" cy="12" r="9.3" stroke="#1d4e89" stroke-width="1.3"/>
                    <line x1="7.3" y1="15.9" x2="16.7" y2="8.1" stroke="#1d4e89" stroke-width="1.3" stroke-dasharray="0.4 2.4" stroke-linecap="round"/>
                    <circle cx="7.3" cy="15.9" r="1.6" fill="#0e7c7b"/>
                    <circle cx="16.7" cy="8.1" r="1.6" fill="#b8860b"/>
                </svg>
                <h1>Lagomarcambios</h1>
                <p>Sistema de Gestión Interna</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required placeholder="usuario@empresa.com">
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                    <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Mostrar contraseña">
                        <i class="ti ti-eye" id="togglePasswordIcon" aria-hidden="true"></i>
                    </button>
                </div>
                
                <div id="loginError" class="error-message"></div>
                
                <button type="submit" class="btn-primary" id="loginBtn">
                    <span class="btn-text">Iniciar Sesión</span>
                    <span class="spinner hidden"></span>
                </button>
            </form>
            
            <div class="login-footer">
                <p>Acceso exclusivo para personal autorizado</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth } from './js/firebase-config.js';
        
        // Verificar sesión existente
        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'app.html';
        });
        
        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');
            
            btn.disabled = true;
            btn.querySelector('.btn-text').textContent = 'Verificando...';
            
            try {
                await auth.signInWithEmailAndPassword(
                    document.getElementById('email').value,
                    document.getElementById('password').value
                );
                window.location.href = 'app.html';
            } catch (error) {
                const errores = {
                    'auth/user-not-found': 'Usuario no registrado',
                    'auth/wrong-password': 'Contraseña incorrecta',
                    'auth/invalid-email': 'Correo inválido',
                    'auth/too-many-requests': 'Demasiados intentos. Intenta más tarde.'
                };
                errorDiv.textContent = errores[error.code] || 'Error al iniciar sesión';
                btn.disabled = false;
                btn.querySelector('.btn-text').textContent = 'Iniciar Sesión';
            }
        });
        
        window.togglePassword = () => {
            const input = document.getElementById('password');
            const icon = document.getElementById('togglePasswordIcon');
            const oculto = input.type === 'password';
            input.type = oculto ? 'text' : 'password';
            icon.className = oculto ? 'ti ti-eye-off' : 'ti ti-eye';
        };
    </script>
</body>
</html>
